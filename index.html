<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quotex Pro Trading Platform</title>
    <meta name="description" content="Professional binary options trading platform with real-time candlestick charts, technical indicators, account management, and trading tools." />
    <meta property="og:title" content="Quotex Pro Trading Platform" />
    <meta property="og:description" content="Professional binary options trading platform with real-time candlestick charts, technical indicators, account management, and trading tools." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>
  <body class="bg-[#0a0d14] text-white">
    <div id="initial-splash-screen" style="position:fixed;inset:0;z-index:9999;background-color:#0a0d14;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;">
      <div style="width:48px;height:48px;border-radius:9999px;border:3px solid rgba(16,185,129,0.2);border-top-color:#10b981;animation:spinSlow 0.8s linear infinite;margin-bottom:16px;"></div>
      <div style="font-size:13px;font-weight:700;letter-spacing:0.08em;color:#e2e8f0;margin-bottom:12px;">Loading...</div>
      <div style="width:180px;height:4px;background:#161f2e;border-radius:9999px;overflow:hidden;">
        <div style="width:45%;height:100%;background:#10b981;border-radius:9999px;"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
