<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quotex Pro Trading Platform</title>
    <meta name="description" content="Professional binary options trading platform with real-time candlestick charts, technical indicators, account management, and trading tools." />
    <meta property="og:title" content="Quotex Pro Trading Platform" />
    <meta property="og:description" content="Professional binary options trading platform with real-time candlestick charts, technical indicators, account management, and trading tools." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
  </head>
  <body class="bg-[#07090e] text-white">
    <!-- Immediate Inline Loading Screen for Instant Refresh Display -->
    <div id="initial-splash-screen" style="position:fixed;inset:0;z-index:9999;background-color:#07090e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;font-family:system-ui,-apple-system,sans-serif;">
      <div style="position:relative;width:96px;height:96px;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;">
        <div style="position:absolute;inset:0;border-radius:9999px;border:2px solid rgba(6,182,212,0.2);border-top-color:#06b6d4;border-right-color:#10b981;animation:spinSlow 1.2s linear infinite;"></div>
        <div style="width:68px;height:68px;border-radius:18px;background:#0d131f;border:1px solid rgba(6,182,212,0.4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(0,229,153,0.4);animation:pulseGlow 2s ease-in-out infinite;overflow:hidden;padding:6px;">
          <img src="/splash-image.png" alt="Quotex Logo" style="width:100%;height:100%;object-fit:contain;border-radius:12px;" />
        </div>
      </div>
      <div style="font-size:22px;font-weight:900;letter-spacing:0.18em;color:#38bdf8;margin-bottom:6px;">QUOTEX PRO</div>
      <div style="font-size:10px;font-weight:800;letter-spacing:0.28em;color:#00e599;text-transform:uppercase;margin-bottom:1.5rem;">INNOVATIVE TRADING PLATFORM</div>
      <div style="width:220px;height:5px;background:#131a26;border-radius:9999px;overflow:hidden;border:1px solid #233146;margin-bottom:12px;">
        <div style="width:55%;height:100%;background:linear-gradient(90deg,#06b6d4,#10b981);border-radius:9999px;"></div>
      </div>
      <div style="font-size:11px;font-weight:600;color:#94a3b8;font-family:monospace;">Loading Quotex Platform...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
