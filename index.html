<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quotex</title>
    <meta name="description" content="Professional binary options trading platform with real-time candlestick charts, technical indicators, account management, and trading tools." />
    <meta property="og:title" content="Quotex" />
    <meta property="og:description" content="Professional binary options trading platform with real-time candlestick charts, technical indicators, account management, and trading tools." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <style>
      @keyframes pulseCandles {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 24px rgba(0, 229, 153, 0.25)); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 36px rgba(0, 229, 153, 0.45)); }
      }
      @keyframes loadProgress {
        0% { width: 12%; }
        50% { width: 65%; }
        100% { width: 92%; }
      }
    </style>
  </head>
  <body class="bg-[#0a0d14] text-white">
    <!-- Instant Refresh Loading Screen with 3-Candlesticks Logo (apple-touch-icon.png) & Zero Text -->
    <div id="initial-splash-screen" style="position:fixed;inset:0;z-index:9999;background-color:#0a0d14;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <div style="width:160px;height:160px;display:flex;align-items:center;justify-content:center;animation:pulseCandles 1.6s ease-in-out infinite;margin-bottom:28px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" style="width:160px;height:160px;border-radius:28px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,0.65);">
          <rect width="1000" height="1000" fill="#0a0d14" />
          <rect x="100" y="100" width="800" height="800" fill="#111723" />
          <rect x="303" y="340" width="24" height="420" fill="#ff3355" />
          <rect x="265" y="420" width="100" height="260" fill="#ff3355" />
          <rect x="488" y="300" width="24" height="420" fill="#00e599" />
          <rect x="450" y="370" width="100" height="270" fill="#00e599" />
          <rect x="673" y="250" width="24" height="430" fill="#00e599" />
          <rect x="635" y="330" width="100" height="270" fill="#00e599" />
        </svg>
      </div>
      <div style="width:150px;height:4px;background:#141b27;border-radius:9999px;overflow:hidden;">
        <div style="height:100%;background:linear-gradient(90deg,#ff3355 0%,#00e599 45%,#00e599 100%);border-radius:9999px;animation:loadProgress 1.3s ease-out forwards;"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
